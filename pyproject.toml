[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidence-governor"
version = "0.1.0"
description = "JevGate: open-source evidence governance for RAG. Jev-powered passage evaluation, deterministic routing, reranking and token-budgeted evidence bundles with provenance and a decision trace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Rajeev" }]
keywords = [
    "rag", "retrieval-augmented-generation", "llm", "reranking", "information-retrieval",
    "evidence-evaluation", "jev", "openrouter", "prompt-injection", "token-budget",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Deliberately minimal: usable with any retriever and any app.
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[project.urls]
Homepage = "https://github.com/rajeevksp/jevgate"
Repository = "https://github.com/rajeevksp/jevgate"
Documentation = "https://rajeevksp.github.io/jevgate/"
Issues = "https://github.com/rajeevksp/jevgate/issues"
Changelog = "https://github.com/rajeevksp/jevgate/blob/master/CHANGELOG.md"

[project.scripts]
evidence-governor = "governor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["governor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
